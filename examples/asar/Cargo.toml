[package]
name = "asar"
version = "0.1.0"
edition = "2024"
description = "ASAR filesystem plugin for krkrz."

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0"
krkrz_plugin_base = { path = "../../", default-features = false, features = ["com"] }
serde_json = "1.0"

[build-dependencies]
winresource = "0.1"

[package.metadata.winresource]
OriginalFilename = "asar.dll"
LegalCopyright = "Copyright ©lifegpc 2026"
CompanyName = "lifegpc"
FileDescription = "ASAR filesystem plugin for krkrz. Source code: https://github.com/lifegpc/krkrz_plugin_base/tree/master/examples/asar"
