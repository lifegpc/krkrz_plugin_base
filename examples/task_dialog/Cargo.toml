[package]
name = "task_dialog"
version = "0.1.0"
edition = "2024"
description = "A Win32 TaskDialog wrapper plugin for krkrz."

[lib]
crate-type = ["cdylib"]

[dependencies]
krkrz_plugin_base = { path = "../../", default-features = false }
windows = { version = "0.62", features = ["Win32_UI_Controls", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }


[build-dependencies]
winresource = "0.1"

[package.metadata.winresource]
OriginalFilename = "task_dialog.dll"
LegalCopyright = "Copyright ©lifegpc 2026"
CompanyName = "lifegpc"
FileDescription = "A Win32 TaskDialog wrapper plugin for krkrz. Source code: https://github.com/lifegpc/krkrz_plugin_base/tree/master/examples/task_dialog"
